<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MatchPoint Pro - Autenticación</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { width: 100%; max-width: 400px; background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 0.85rem; color: #475569; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        .btn-login { width: 100%; background: #0ea5e9; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top:0; text-align:center; color:#0f172a;">Iniciar Sesión</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>
    </div>
</body>
</html>
