<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchPoint Pro - Formulario Técnico</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; margin: 0; padding: 0; color: #1e293b; }
        .container { max-width: 600px; margin: 3rem auto; padding: 1rem; }
        .card { background-color: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 2rem; border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; color: #475569; }
        .form-control, .form-select { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.9rem; box-sizing: border-box; }
        .btn { padding: 0.5rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9rem; border: none; cursor: pointer; display: inline-block; }
        .btn-primary { background-color: #0f172a; color: white; }
        .btn-secondary { background-color: #e2e8f0; color: #475569; margin-right: 0.5rem; }
        .errorlist { color: #ef4444; font-size: 0.85rem; margin: 0.25rem 0 0 0; padding-left: 1rem; }
    </style>
</head>
<body>
    <main class="container">
        <div class="card">
            <h2 style="margin-top: 0; margin-bottom: 1.5rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem;">{{ titulo }}</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-group">
                        <label>{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            {{ field.errors }}
                        {% endif %}
                    </div>
                {% endfor %}
                <div style="text-align: right; margin-top: 2rem;">
                    <a href="{% url 'gestion_canchas' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Registro</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
